    .modal-title{display:flex;align-items:center;justify-content:space-between;gap:15px}.modal-title h2{margin:0}.x{width:36px;height:36px;padding:0;border-radius:50%;font-size:1.25rem}.formula-tools{display:flex;flex-wrap:wrap;gap:5px}.formula-tools button{padding:6px 8px;font-family:Georgia,serif;font-size:.9rem}.math-preview{min-height:46px;border:1px dashed var(--line);padding:10px;border-radius:10px;color:var(--ink);font-size:1.1rem;overflow:auto}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif;white-space:nowrap;letter-spacing:0}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.05;margin:0 .13em}.frac .top{display:block;padding:0 .16em;border-bottom:1.5px solid currentColor}.frac .bottom{display:block;padding:.08em .16em 0}.math sup,.math sub{font-size:.65em}.drafts{margin-top:28px;border-top:1px solid var(--line);padding-top:17px}.draft-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.draft-head h2{font-size:1rem;margin:0}.draft-card{opacity:.82;border-style:dashed}.draft-badge{color:var(--warn);font-size:.73rem;text-transform:uppercase;font-weight:800;letter-spacing:.1em}.randomize{margin-left:auto}.modal-back{cursor:default}.modal{position:relative}.formula-help{color:var(--muted);font-size:.78rem;margin:4px 0 0}

ht:700}.advanced-select .study-tree{margin-top:10px;max-height:42vh;overflow:auto;padding-right:4px}#review-decks{display:block}
    .review-edit{position:absolute;top:16px;right:18px;z-index:2;padding:6px 9px;font-size:.76rem;opacity:.72}.review-edit:hover{opacity:1}body.aurora{--panel:#12273d;--panel2:#1c4660;--ink:#f5fbff;--muted:#b9d9e8;--line:#39769a;--accent:#60d6b8;background:radial-gradient(circle at 10% 0,#246f9a,#192555 48%,#102021)}body.aurora .add,body.aurora .flip{background:linear-gradient(90deg,#55d9b6,#7295ff)}body.coral{--panel:#482638;--panel2:#70354c;--ink:#fff7f1;--muted:#ecc9ba;--line:#af6370;--accent:#ff816c;background:radial-gradient(circle at 85% 0,#b44c66,#352039 65%)}body.coral .add,body.coral .flip{background:linear-gradient(90deg,#ff826d,#ffc16b)}body.cyber{--panel:#14142f;--panel2:#29255b;--ink:#f6f2ff;--muted:#c8c1ec;--line:#665fc4;--accent:#e85cff;background:radial-gradient(circle at 15% 0,#4d2379,#11142c 62%)}body.cyber .add,body.cyber .flip{background:linear-gradient(90deg,#e85cff,#42d9ff)}body.paper{--panel:#fffdf7;--panel2:#f0ebdc;--ink:#2c302d;--muted:#6d746d;--line:#d5ccbb;--accent:#7e8e65;background:linear-gradient(135deg,#fbf7ed,#e9e3d3)}body.paper .study-card{background:linear-gradient(145deg,#fffdf7,#f2ede1)}body.paper .field input,body.paper .field textarea,body.paper .field select,body.paper .preview{background:#fffdf7}body.paper .add,body.paper .flip{background:#7e8e65}body.slate{--panel:#242b35;--panel2:#353f4c;--ink:#f4f6f8;--muted:#bdc5ce;--line:#596675;--accent:#9eacbb;background:linear-gradient(135deg,#182029,#303946)}body.slate .add,body.slate .flip{background:#75879b}body.ink{--panel:#1a1b1f;--panel2:#292a30;--ink:#f1eee8;--muted:#bbb6ad;--line:#4b4b50;--accent:#c5a467;background:radial-gradient(circle at 80% 0,#403427,#18191d 64%)}body.ink .add,body.ink .flip{background:#b88d48;color:#1b1710}@media(max-width:640px){.app{padding:12px}.brand{font-size:1.05rem}.controls button{padding:9px}.form-grid{grid-template-columns:1fr}.studybar{top:88px;left:12px;right:12px}.study-card{min-height:calc(100vh - 182px);border-radius:19px;padding:42px 20px 2 <body class="dark"><main class="app">
  <header class="top"><div class="brand"><span class="mark">✦</span> Flash Infinito</div><div class="controls"><button class="ghost" id="backup">▣ Guardado</button><select id="theme" aria-label="Estilo"><option value="dark">Azul nocturno</option><option value="light">Claro y limpio</option><option value="vivid">Violeta eléctrico</option><option value="ocean">Océano</option><option value="forest">Bosque</option><option value="sunset">Atardecer</option><option value="mono">Monocromo</option><option value="neon">Neón turquesa</option><option value="candy">Candy pop</option><option value="retro">Retro dorado</option><option value="aurora">Aurora boreal</option><option value="coral">Coral tropical</option><option value="cyber">Cyber pop</option><option value="paper">Papel cálido</option><option value="slate">Pizarra sobria</option><option value="ink">Tinta y bronce</option></select><button class="ghost" id="fullscreen">⛶</button></div></header>
  <nav class="tabs"><button class="tab active" data-view="library">Mis tarjetas</button><button class="tab" data-view="review">Repasar</button></nav>
  <section id="library" class="view active"><div class="deckbar" id="deckbar"></div><div id="library-content"></div></section>
  <section id="review" class="view"><div class="deckbar" id="review-decks"></div><div class="review-layout"><div class="studybar"><span id="study-deck">Elegí un mazo</span><span>•</span><span id="study-count">0 tarjetas</span></div><div id="review-content"></div></div></section>
</main><div id="modal-root"></div><div class="toast" id="toast"></div>
<script>
/* v2: repaso aleatorio con distancia preservada, borradores y fórmulas locales */
let DB='flash-infinito-v1'; const STORE='app';
function starterState(){let deck={id:'renal',name:'Renal'},data=[
['Presión efectiva de filtración (valor y fórmula)','10 mmHg\n\nPEF = ΔPh - Δπ'],
['Presión hidrostática del capilar (glomérulo)\n(valor y sentido con respecto al filtrado)','60 mmHg en favor del filtrado'],
['Presión oncótica del capilar (glomérulo)\n(valor y sentido con respecto al filtrado)','entre 25 (arteriola aferente) y 32 (arteriola eferente) mmHg en contra del filtrado'],
['Presión oncótica de la Cápsula de Bowman\n(valor y sentido con respecto al filtrado)','0 mmHg'],
['Presión hidrostática la Cápsula de Bowman\n(valor y sentido con respecto al filtrado)','18 mmHg en contra del filtrado'],
['Kf (coeficiente de filtración)\n(de qué depende, cómo se regula y a qué ecuación pertenece)','Es característico de cada especie, depende del área y la permeabilidad de la superficie filtrante (barrera de filtración)…'],
['VFG\n(ecuación y estimación)','VFG = Kf x PEF\n\nEl volumen o tasa de filtrado glomerular equivale al producto …']
];return {decks:[deck],cards:data.map((x,i)=>({id:'renal-'+(i+1),deckId:'renal',front:x[0],back:x[1],frontImg:'',backImg:'',draft:false})),theme:'dark',activeDeck:'all',reviewDeck:'all',review:{deck:null,turn:0,due:{}},current:null,flipped:false}}
let state=starterState();
const $=s=>document.querySelector(s), id=()=>crypto.randomUUID();
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){let db=await openDB();return new Promise(ok=>{let t=db.transaction(STORE).objectStore(STORE).get('state');t.onsuccess=()=>ok(t.result||null)})}
async function save(){let db=await openDB();return new Promise(ok=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'state');t.oncomplete=ok})}
function toast(msg){let e=$('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function complete(c){return Boolean((c.front||c.frontImg)&&(c.back||c.backImg))}
function cardsFor(deck){return state.cards.filter(c=>!c.draft&&complete(c)&&(deck==='all'||c.deckId===deck))}
function draftsFor(deck){return state.cards.filter(c=>(c.draft||!complete(c))&&(deck==='all'||c.deckId===deck))}
function nameOf(deck){return deck==='all'?'Todas juntas':state.decks.find(d=>d.id===deck)?.name||'Mazo'}
let deckTap={id:'',time:0};
function renameDeck(deckId){let deck=state.decks.find(d=>d.id===deckId),name=prompt('Nombre del mazo:',deck?.name||'');if(name===null)return;name=name.trim();if(!name)return toast('Escribí un nombre');deck.name=name;save();render()}
function deckButtons(target,which){let active=state[which];target.innerHTML=`<button class="deck all ${active==='all'?'active':''}" data-deck="all">Todas juntas <small>(${cardsFor('all').length})</small></button>`+state.decks.map(d=>`<button class="deck ${active===d.id?'active':''}" data-deck="${d.id}" title="Doble clic para editar el nombre">${esc(d.name)} <small>(${cardsFor(d.id).length})</small></button>`).join('')+(which==='activeDeck'?'<button class="add" id="new-deck">＋ Mazo</button>':'<button class="ghost randomize" id="reshuffle">↻ Randomizar</button>');target.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{let now=Date.now(),same=which==='activeDeck'&&b.dataset.deck!=='all'&&deckTap.id===b.dataset.deck&&now-deckTap.time<400;if(same){deckTap={id:'',time:0};renameDeck(b.dataset.deck);return}deckTap={id:b.dataset.deck,time:now};setTimeout(()=>{if(deckTap.id===b.dataset.deck){state[which]=b.dataset.deck;deckTap={id:'',time:0};render();save()}},401)});if(which==='activeDeck')$('#new-deck').onclick=deckModal;else $('#reshuffle').onclick=reshuffle}
function render(){document.body.className=state.theme;$('#theme').value=state.theme;deckButtons($('#deckbar'),'activeDeck');deckButtons($('#review-decks'),'reviewDeck'); renderLibrary();renderReview()}
function mini(c,draft=false){return `<article class="mini ${draft?'draft-card':''}">${draft?'<div class="draft-badge">Borrador · no entra al repaso</div>':''}<div class="side">Anverso</div>${c.frontImg?`<img src="${c.frontImg}">`:''}<div class="text">${renderRich(c.front)||'<em>Sin completar</em>'}</div><div class="side">Reverso</div>${c.backImg?`<img src="${c.backImg}">`:''}<div class="text">${renderRich(c.back)||'<em>Sin completar</em>'}</div><div class="mini-actions"><button data-edit="${c.id}">${draft?'Continuar':'Editar'}</button><button class="danger" data-delete="${c.id}">Eliminar</button></div></article>`}
function renderLibrary(){let cards=cardsFor(state.activeDeck),drafts=draftsFor(state.activeDeck),el=$('#library-content');let regular=cards.length?`<div class="card-list">${cards.map(c=>mini(c)).join('')}</div>`:`<div class="empty"><div><h2>Tu mazo está listo para empezar</h2><p>Creá una tarjeta con texto, imágenes o ambas cosas.</p><button class="add" id="new-card">＋ Crear primera tarjeta</button></div></div>`;let d=drafts.length?`<section class="drafts"><div class="draft-head"><h2>Borradores</h2><span class="status">${drafts.length} pendiente${drafts.length!==1?'s':''}</span></div><div class="card-list">${drafts.map(c=>mini(c,true)).join('')}</div></section>`:'';el.innerHTML=regular+d+`<p style="margin:16px 0"><button class="add" id="new-card">＋ Nueva tarjeta</button></p>`;$('#new-card').onclick=()=>cardModal();el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>cardModal(state.cards.find(c=>c.id===b.dataset.edit)));el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar esta tarjeta?')){state.cards=state.cards.filter(c=>c.id!==b.dataset.delete);await save();render()}})}
function latexHtml(s=''){let x=esc(s);let old;do{old=x;x=x.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'<span class="frac"><span class="top">$1</span><span class="bottom">$2</span></span>').replace(/\\sqrt\{([^{}]*)\}/g,'√<span style="text-decoration:overline">$1</span>')}while(x!==old);x=x.replace(/\\(alpha|beta|gamma|delta|epsilon|theta|lambda|mu|pi|rho|sigma|phi|omega|Delta|Sigma|Omega|infty|times|cdot|pm|le|ge|neq|rightarrow|leftarrow)/g,(_,v)=>({alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',phi:'φ',omega:'ω',Delta:'Δ',Sigma:'Σ',Omega:'Ω',infty:'∞',times:'×',cdot:'·',pm:'±',le:'≤',ge:'≥',neq:'≠',rightarrow:'→',leftarrow:'←'}[v])).replace(/\^\{([^{}]*)\}|\^([^\s])/g,'<sup>$1$2</sup>').replace(/_\{([^{}]*)\}|_([^\s])/g,'<sub>$1$2</sub>').replace(/[{}]/g,'');return `<span class="math">${x}</span>`}
function renderRich(text=''){return esc(text).replace(/\$([^$]+)\$/g,(_,m)=>latexHtml(m)).replace(/\n/g,'<br>')}
function cardFace(text,img,reference=''){return `<div class="study-content">${reference}${text?`<div class="study-text">${renderRich(text)}</div>`:''}${img?`<img class="study-image" src="${img}">`:''}</div>`}
function ensureReview(cards){if(!state.review||state.review.deck!==state.reviewDeck){state.review={deck:state.reviewDeck,turn:0,due:{}};cards.forEach(c=>state.review.due[c.id]=0)}cards.forEach(c=>{if(state.review.due[c.id]===undefined)state.review.due[c.id]=0})}
function renderReview(){let el=$('#review-content'),cards=cardsFor(state.reviewDeck);$('#study-deck').textContent=nameOf(state.reviewDeck);$('#study-count').textContent=cards.length+' tarjeta'+(cards.length!==1?'s':'');if(!cards.length){el.innerHTML='<div class="empty"><div><h2>No hay tarjetas para repasar</h2><p>Completá un borrador o elegí otro mazo.</p></div></div>';return}ensureReview(cards);if(!state.current||!cards.some(c=>c.id===state.current.id)){nextCard();return}let c=state.current,side=state.flipped?'back':'front',img=state.flipped?c.backImg:c.frontImg,ref=state.flipped?`<div class="question-reference"><b>Consigna</b>${renderRich(c.front)}</div>`:'';el.innerHTML=`<article class="study-card ${img?'has-img':''}" title="Hacé clic para voltear"> <div class="label">${state.flipped?'Reverso · respuesta':'Anverso · pregunta'}</div>${cardFace(c[side],img,ref)}</article>${state.flipped?`<div class="grades"><button class="grade-error" data-grade="error">Error<br><small>pronto</small></button><button class="grade-mid" data-grade="mid">Incompleto<br><small>más tarde</small></button><button class="grade-good" data-grade="good">Correcto<br><small>mucho más tarde</small></button></div>`:`<button class="flip" id="flip">Ver respuesta <span aria-hidden="true">↵</span></button>`}`;el.querySelector('.study-card').onclick=flip;if(!state.flipped)$('#flip').onclick=flip;else el.parentElement.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade))}
function nextCard(){let cards=cardsFor(state.reviewDeck);if(!cards.length)return;ensureReview(cards);let due=state.review.due,available=cards.filter(c=>due[c.id]<=state.review.turn&&c.id!==state.current?.id);let group=available.length?available:cards.filter(c=>c.id!==state.current?.id);if(!group.length)group=cards;state.current=group[Math.floor(Math.random()*group.length)];state.review.turn++;state.flipped=false;save();renderReview()}
function flip(){state.flipped=!state.flipped;renderReview()}
async function grade(g){let gaps={error:2,mid:7,good:18};state.review.due[state.current.id]=state.review.turn+gaps[g];state.current=null;state.flipped=false;await save();nextCard()}
function reshuffle(){let cards=cardsFor(state.reviewDeck);if(!cards.length)return;ensureReview(cards);state.current=null;state.flipped=false;nextCard();toast('Mazo randomizado; se conservaron las repeticiones pendientes')}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`}function closeModal(){$('#modal-root').innerHTML=''}
function backupModal(){modal(`<div class="modal-title"><h2>Guardado</h2><button class="x ghost" id="close-backup">×</button></div><p class="hint">El guardado incluye mazos, tarjetas, imágenes y progreso. Copialo y conserválo en una nota o archivo.</p><div class="modal-actions" style="justify-content:flex-start"><button class="add" id="copy-backup">Copiar guardado</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><label class="field">Restaurar desde un guardado<textarea id="restore-data" placeholder="Pegá acá el texto que copiaste"></textarea></label><div class="modal-actions"><button class="ghost" id="restore">Restaurar y reemplazar datos</button></div>`);$('#close-backup').onclick=closeModal;$('#copy-backup').onclick=async()=>{let text='FLASH_INFINITO_V2\n'+JSON.stringify(state);try{await navigator.clipboard.writeText(text);toast('Guardado copiado al portapapeles')}catch{let area=$('#restore-data');area.value=text;area.select();toast('Copialo manualmente desde el cuadro')}};$('#restore').onclick=async()=>{let raw=$('#restore-data').value.trim().replace(/^FLASH_INFINITO_V2\s*/,'');try{let next=JSON.parse(raw);if(!Array.isArray(next.decks)||!Array.isArray(next.cards))throw Error();if(!confirm('Esto reemplazará las tarjetas y el progreso actuales. ¿Continuar?'))return;state={...starterState(),...next};state.current=null;state.flipped=false;await save();closeModal();render();toast('Guardado restaurado')}catch{toast('Ese guardado no es válido')}}}
function deckModal(){modal(`<h2>Nuevo mazo</h2><label class="field">Nombre del tema<input id="deck-name" maxlength="50" placeholder="Ej.: Biología"></label><div class="modal-actions"><button class="ghost" id="cancel">Cancelar</button><button class="add" id="save-deck">Crear mazo</button></div>`);$('#cancel').onclick=closeModal;$('#save-deck').onclick=async()=>{let n=$('#deck-name').value.trim();if(!n)return toast('Escribí un nombre');state.decks.push({id:id(),name:n});await save();closeModal();render()};setTimeout(()=>$('#deck-name').focus(),50)}
function cardModal(c){let fresh=!c;c=c||{id:id(),deckId:state.activeDeck==='all'?(state.decks[0]?.id||''):state.activeDeck,front:'',back:'',frontImg:'',backImg:'',draft:true};if(!state.decks.length){toast('Primero creá un mazo');return deckModal()} modal(`<div class="modal-title"><h2>${fresh?'Nueva tarjeta':'Editar tarjeta'}</h2><button class="x ghost" id="close-card" title="Guardar como borrador y cerrar">×</button></div><div class="form-grid"><label class="field">Mazo<select id="card-deck">${state.decks.map(d=>`<option value="${d.id}" ${d.id===c.deckId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><div></div>${faceEditor('front','Anverso','Pregunta o concepto',c.front,c.frontImg)}${faceEditor('back','Reverso','Respuesta o explicación',c.back,c.backImg)}</div><p class="hint">Escribí una fórmula entre <b>$</b>: <code>$\\frac{x}{2}$</code>. Se ve en la vista previa y también en el repaso.</p><div class="modal-actions"><button class="add" id="save-card">Guardar tarjeta</button></div>`);let imgs={front:c.frontImg,back:c.backImg};let timer;function setImg(side,data){imgs[side]=data;let p=$('#'+side+'-preview');p.src=data;p.classList.toggle('hidden',!data);autosave()}function persist(){Object.assign(c,{deckId:$('#card-deck').value,front:$('#front').value.trim(),back:$('#back').value.trim(),frontImg:imgs.front,backImg:imgs.back});c.draft=!complete(c);if(fresh&&!state.cards.some(x=>x.id===c.id))state.cards.push(c);return save()}function autosave(){clearTimeout(timer);timer=setTimeout(async()=>{await persist();updatePreviews()},260)}function updatePreviews(){['front','back'].forEach(s=>{$('#'+s+'-math').innerHTML=renderRich($('#'+s).value)||'<span class="status">La fórmula se previsualiza acá</span>'})}async function leave(){await persist();closeModal();render();toast(c.draft?'Guardado en Borradores':'Cambios guardados')}function insert(side,text){let e=$('#'+side),a=e.selectionStart,b=e.selectionEnd;e.setRangeText(text,a,b,'end');e.focus();autosave()}async function file(side,f){if(!f?.type.startsWith('image/'))return toast('Elegí una imagen');let r=new FileReader;r.onload=()=>setImg(side,r.result);r.readAsDataURL(f)};['front','back'].forEach(side=>{let e=$('#'+side);e.oninput=autosave;e.onblur=autosave;$('[data-pick="'+side+'"]').onclick=()=>$('#'+side+'-file').click();$('#'+side+'-file').onchange=e=>file(side,e.target.files[0]);$('[data-paste="'+side+'"]').onclick=async()=>{try{let items=await navigator.clipboard.read();for(let item of items){let type=item.types.find(t=>t.startsWith('image/'));if(type)return file(side,await item.getType(type))}toast('No hay una imagen en el portapapeles')}catch{toast('Permití el portapapeles o usá “Subir imagen”')}};document.querySelectorAll('[data-formula="'+side+'"]').forEach(b=>b.onclick=()=>insert(side,b.dataset.insert))});updatePreviews();$('#card-deck').onchange=autosave;$('#close-card').onclick=leave;$('#save-card').onclick=leave}
function faceEditor(side,label,placeholder,text,img){return `<label class="field">${label}<textarea id="${side}" placeholder="${placeholder}">${esc(text||'')}</textarea><div class="formula-tools"><button type="button" data-formula="${side}" data-insert="$\\frac{}{ }$">⅟</button><button type="button" data-formula="${side}" data-insert="$\\sqrt{}$">√</button><button type="button" data-formula="${side}" data-insert="$x^{}$">x²</button><button type="button" data-formula="${side}" data-insert="$x_{}$">x₂</button><button type="button" data-formula="${side}" data-insert="$\\pi$">π</button></div><div class="math-preview" id="${side}-math"></div><div class="image-row"><input type="file" accept="image/*" id="${side}-file" hidden><button type="button" data-pick="${side}">Subir imagen</button><button type="button" data-paste="${side}">Pegar imagen</button><button type="button" class="ghost danger ${img?'':'hidden'}" data-remove-img="${side}">Quitar imagen</button></div><img class="preview ${img?'':'hidden'}" id="${side}-preview" src="${img||''}"></label>`}

/* Materias → carpetas → mazos */
function hierarchy(){if(!state.subjects||!state.folders){let subject={id:'general',name:'FISIOLOGÍA'},folder={id:'general-folder',subjectId:'general',name:'Segundo parcial'};state.subjects=[subject];state.folders=[folder];state.decks.forEach(d=>d.folderId='general-folder');state.activeSubject='general';state.studySelection=state.decks.map(d=>d.id)}if(!state.migratedFisioV2){let subject=state.subjects.find(s=>s.name.toUpperCase()==='GENERAL');if(subject)subject.name='FISIOLOGÍA';let fisio=state.subjects.find(s=>s.name.toUpperCase()==='FISIOLOGÍA');let folder=state.folders.find(f=>f.subjectId===fisio?.id&&(f.name==='Mazos generales'||f.name==='General'));if(folder)folder.name='Segundo parcial';state.migratedFisioV2=true;save()}if(!state.selectionModalV1){state.studySelection=state.decks.map(d=>d.id);state.selectionModalV1=true;save()}}
function subjectFolders(subjectId){return state.folders.filter(f=>f.subjectId===subjectId)}
function folderDecks(folderId){return state.decks.filter(d=>d.folderId===folderId)}
function reviewCards(){hierarchy();let set=new Set(state.studySelection||[]);return state.cards.filter(c=>!c.draft&&complete(c)&&set.has(c.deckId))}
function deckOptions(selected){hierarchy();return state.subjects.map(s=>`<optgroup label="${esc(s.name)}">${subjectFolders(s.id).map(f=>folderDecks(f.id).map(d=>`<option value="${d.id}" ${d.id===selected?'selected':''}>${esc(f.name)} › ${esc(d.name)}</option>`).join('')).join('')}</optgroup>`).join('')}
function newSubject(){let n=prompt('Nombre de la materia:');if(!n?.trim())return;state.subjects.push({id:id(),name:n.trim()});save();render()}
function newFolder(subjectId){let n=prompt('Nombre de la carpeta o grupo:');if(!n?.trim())return;state.folders.push({id:id(),subjectId,name:n.trim()});save();render()}
function newDeck(folderId){let n=prompt('Nombre del mazo:');if(!n?.trim())return;let d={id:id(),name:n.trim(),folderId};state.decks.push(d);state.studySelection.push(d.id);save();render()}
function deckButtons(target,which){hierarchy();if(which==='activeDeck'){let sid=state.activeSubject||state.subjects[0]?.id;target.innerHTML=state.subjects.map(s=>`<button class="deck ${sid===s.id?'active':''}" data-subject="${s.id}">${esc(s.name)}</button>`).join('')+'<button class="add" id="new-subject">＋ Materia</button>';target.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{state.activeSubject=b.dataset.subject;state.activeDeck='all';render();save()});$('#new-subject').onclick=newSubject}else{target.innerHTML='<span class="status">Elegí uno o varios mazos para el repaso:</span>'}}
function renameItem(type,itemId){let list=type==='folder'?state.folders:state.decks,item=list.find(x=>x.id===itemId),name=prompt('Nuevo nombre:',item?.name||'');if(!name?.trim())return;item.name=name.trim();save();render()}
function deleteDeck(deckId){let deck=state.decks.find(d=>d.id===deckId),count=state.cards.filter(c=>c.deckId===deckId).length;if(!deck||!confirm(`¿Eliminar el mazo “${deck.name}” y sus ${count} tarjeta${count===1?'':'s'}?`))return;state.decks=state.decks.filter(d=>d.id!==deckId);state.cards=state.cards.filter(c=>c.deckId!==deckId);state.studySelection=(state.studySelection||[]).filter(id=>id!==deckId);if(state.activeDeck===deckId)state.activeDeck='all';state.current=null;save();render();toast('Mazo eliminado')}
function deleteFolder(folderId){let folder=state.folders.find(f=>f.id===folderId),deckIds=folderDecks(folderId).map(d=>d.id),count=state.cards.filter(c=>deckIds.includes(c.deckId)).length;if(!folder||!confirm(`¿Eliminar la carpeta “${folder.name}”, sus ${deckIds.length} mazo${deckIds.length===1?'':'s'} y ${count} tarjeta${count===1?'':'s'}?`))return;state.folders=state.folders.filter(f=>f.id!==folderId);state.decks=state.decks.filter(d=>!deckIds.includes(d.id));state.cards=state.cards.filter(c=>!deckIds.includes(c.deckId));state.studySelection=(state.studySelection||[]).filter(id=>!deckIds.includes(id));if(deckIds.includes(state.activeDeck))state.activeDeck='all';state.current=null;save();render();toast('Carpeta eliminada')}
function renderLibrary(){hierarchy();let sid=state.activeSubject||state.subjects[0]?.id,folders=subjectFolders(sid),el=$('#library-content');el.innerHTML=folders.map(f=>`<section class="folder"><div class="folder-title" data-folder-title="${f.id}" title="Doble clic para editar"><span>${esc(f.name)}</span><span class="folder-actions"><button class="ghost" data-deck-new="${f.id}">＋ Mazo</button><button class="ghost danger remove-small" data-folder-delete="${f.id}">Eliminar</button></span></div><div class="deckbar">${folderDecks(f.id).map(d=>`<button class="deck ${state.activeDeck===d.id?'active':''}" data-deck-open="${d.id}" title="Doble clic para editar">${esc(d.name)} <small>(${cardsFor(d.id).length})</small></button>`).join('')}</div>${state.activeDeck&&state.activeDeck!=='all'&&folderDecks(f.id).some(d=>d.id===state.activeDeck)?cardsArea(cardsFor(state.activeDeck),draftsFor(state.activeDeck)):''}</section>`).join('')+`<p><button class="add" id="new-folder">＋ Carpeta o grupo</button></p>`;el.querySelectorAll('[data-deck-new]').forEach(b=>b.onclick=()=>newDeck(b.dataset.deckNew));el.querySelectorAll('[data-folder-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteFolder(b.dataset.folderDelete)});el.querySelectorAll('[data-folder-title]').forEach(b=>b.ondblclick=e=>{if(!e.target.closest('button'))renameItem('folder',b.dataset.folderTitle)});el.querySelectorAll('[data-deck-open]').forEach(b=>{b.onclick=()=>{state.activeDeck=b.dataset.deckOpen;render();save()};b.ondblclick=()=>renameItem('deck',b.dataset.deckOpen)});$('#new-folder').onclick=()=>newFolder(sid);bindCards(el)}
function cardsArea(cards,drafts){let list=cards.length?`<div class="card-list">${cards.map(c=>mini(c)).join('')}</div>`:'<p class="status">Este mazo todavía no tiene tarjetas.</p>';return list+(drafts.length?`<section class="drafts"><div class="draft-head"><h2>Borradores</h2></div><div class="card-list">${drafts.map(c=>mini(c,true)).join('')}</div></section>`:'')+`<div class="deck-actions"><button class="add" data-new-card>＋ Nueva tarjeta</button><button class="ghost danger" data-delete-active-deck>Eliminar mazo</button></div>`}
function bindCards(el){el.querySelectorAll('[data-new-card]').forEach(b=>b.onclick=()=>cardModal());el.querySelectorAll('[data-delete-active-deck]').forEach(b=>b.onclick=()=>deleteDeck(state.activeDeck));el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>cardModal(state.cards.find(c=>c.id===b.dataset.edit)));el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar esta tarjeta?')){state.cards=state.cards.filter(c=>c.id!==b.dataset.delete);await save();render()}})}
function selectionTree(){return state.subjects.map(s=>{let fs=subjectFolders(s.id),all=fs.flatMap(f=>folderDecks(f.id).map(d=>d.id)),chosen=all.length&&all.every(x=>state.studySelection.includes(x));return `<div class="study-group"><label><input type="checkbox" data-select-subject="${s.id}" ${chosen?'checked':''}> <b>${esc(s.name)}</b></label>${fs.map(f=>{let ds=folderDecks(f.id),ok=ds.length&&ds.every(d=>state.studySelection.includes(d.id));return `<div class="study-folder"><label><input type="checkbox" data-select-folder="${f.id}" ${ok?'checked':''}> ${esc(f.name)}</label>${ds.map(d=>`<label><input type="checkbox" data-select-deck="${d.id}" ${state.studySelection.includes(d.id)?'checked':''}> ${esc(d.name)}</label>`).join('')}</div>`}).join('')}</div>`}).join('')}
function setSelection(ids,on){let x=new Set(state.studySelection);ids.forEach(i=>on?x.add(i):x.delete(i));state.studySelection=[...x];state.current=null;save();render()}
function studyModal(){hierarchy();let chosen=new Set(state.studySelection||[]),advanced=false;let decksForSubject=s=>subjectFolders(s).flatMap(f=>folderDecks(f.id).map(d=>d.id));function toggle(ids,on){ids.forEach(id=>on?chosen.add(id):chosen.delete(id))}function tree(){return state.subjects.map(s=>{let fs=subjectFolders(s.id),ids=decksForSubject(s.id),ok=ids.length&&ids.every(id=>chosen.has(id));return `<div class="study-group"><label><input type="checkbox" data-modal-subject="${s.id}" ${ok?'checked':''}> <b>${esc(s.name)}</b></label>${fs.map(f=>{let ds=folderDecks(f.id),on=ds.length&&ds.every(d=>chosen.has(d.id));return `<div class="study-folder"><label><input type="checkbox" data-modal-folder="${f.id}" ${on?'checked':''}> ${esc(f.name)}</label>${ds.map(d=>`<label><input type="checkbox" data-modal-deck="${d.id}" ${chosen.has(d.id)?'checked':''}> ${esc(d.name)}</label>`).join('')}</div>`}).join('')}</div>`}).join('')}function draw(){modal(`<div class="modal-title"><h2>¿Qué querés repasar?</h2><button class="x ghost" id="close-study">×</button></div><p class="hint">Elegí una o más materias completas. Cada una incluye todas sus carpetas y mazos.</p><div>${state.subjects.map(s=>{let ids=decksForSubject(s.id),ok=ids.length&&ids.every(id=>chosen.has(id));return `<label class="subject-choice"><input type="checkbox" data-subject-choice="${s.id}" ${ok?'checked':''}><b>${esc(s.name)}</b><small>${ids.length} mazo${ids.length===1?'':'s'}</small></label>`}).join('')}</div><details class="advanced-select" ${advanced?'open':''}><summary>Elegir carpetas o mazos específicos</summary><div class="study-tree">${tree()}</div></details><div class="modal-actions"><button class="ghost" id="select-all">Todas las materias</button><button class="add" id="apply-study">Aplicar selección</button></div>`);$('#close-study').onclick=closeModal;$('.advanced-select').ontoggle=e=>advanced=e.target.open;document.querySelectorAll('[data-subject-choice]').forEach(x=>x.onchange=()=>{toggle(decksForSubject(x.dataset.subjectChoice),x.checked);draw()});document.querySelectorAll('[data-modal-subject]').forEach(x=>x.onchange=()=>{toggle(decksForSubject(x.dataset.modalSubject),x.checked);draw()});document.querySelectorAll('[data-modal-folder]').forEach(x=>x.onchange=()=>{toggle(folderDecks(x.dataset.modalFolder).map(d=>d.id),x.checked);advanced=true;draw()});document.querySelectorAll('[data-modal-deck]').forEach(x=>x.onchange=()=>{toggle([x.dataset.modalDeck],x.checked);advanced=true;draw()});$('#select-all').onclick=()=>{chosen=new Set(state.decks.map(d=>d.id));draw()};$('#apply-study').onclick=async()=>{state.studySelection=[...chosen];state.current=null;await save();closeModal();render()}}draw()}
function renderReview(){hierarchy();let el=$('#review-content'),cards=reviewCards();$('#review-decks').innerHTML=`<div class="study-tree">${selectionTree()}</div><button class="ghost randomize" id="reshuffle">↻ Randomizar</button>`;$('#reshuffle').onclick=reshuffle;$('#review-decks').querySelectorAll('[data-select-deck]').forEach(x=>x.onchange=()=>setSelection([x.dataset.selectDeck],x.checked));$('#review-decks').querySelectorAll('[data-select-folder]').forEach(x=>x.onchange=()=>setSelection(folderDecks(x.dataset.selectFolder).map(d=>d.id),x.checked));$('#review-decks').querySelectorAll('[data-select-subject]').forEach(x=>x.onchange=()=>setSelection(subjectFolders(x.dataset.selectSubject).flatMap(f=>folderDecks(f.id).map(d=>d.id)),x.checked));$('#study-deck').textContent='Selección actual';$('#study-count').textContent=cards.length+' tarjeta'+(cards.length!==1?'s':'');if(!cards.length){el.innerHTML='<div class="empty"><div><h2>Elegí al menos un mazo</h2></div></div>';return}if(!state.current||!cards.some(c=>c.id===state.current.id)){nextCard();return}let c=state.current,side=state.flipped?'back':'front',img=state.flipped?c.backImg:c.frontImg,ref=state.flipped?`<div class="question-reference"><b>Consigna</b>${renderRich(c.front)}</div>`:'';el.innerHTML=`<article class="study-card ${img?'has-img':''}"><div class="label">${state.flipped?'Reverso · respuesta':'Anverso · pregunta'}</div>${cardFace(c[side],img,ref)}</article>${state.flipped?`<div class="grades"><button class="grade-error" data-grade="error">Error<br><small>pronto</small></button><button class="grade-mid" data-grade="mid">Incompleto<br><small>más tarde</small></button><button class="grade-good" data-grade="good">Correcto<br><small>mucho más tarde</small></button></div>`:`<button class="flip" id="flip">Ver respuesta</button>`}`;el.querySelector('.study-card').onclick=flip;if(!state.flipped)$('#flip').onclick=flip;else el.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade))}
function ensureReview(cards){if(!state.review){state.review={turn:0,due:{}}}cards.forEach(c=>{if(state.review.due[c.id]===undefined)state.review.due[c.id]=0})}
function nextCard(){let cards=reviewCards();if(!cards.length)return;ensureReview(cards);let due=state.review.due,available=cards.filter(c=>due[c.id]<=state.review.turn&&c.id!==state.current?.id),group=available.length?available:cards.filter(c=>c.id!==state.current?.id);if(!group.length)group=cards;state.current=group[Math.floor(Math.random()*group.length)];state.review.turn++;state.flipped=false;save();renderReview()}
function grade(g){let gaps={error:2,mid:7,good:18};state.review.due[state.current.id]=state.review.turn+gaps[g];state.current=null;state.flipped=false;save();nextCard()}
function reshuffle(){state.current=null;state.flipped=false;nextCard();toast('Selección randomizada; se conservaron las repeticiones pendientes')}
function cardModal(c){hierarchy();let fresh=!c;c=c||{id:id(),deckId:state.activeDeck!=='all'?state.activeDeck:(state.decks[0]?.id||''),front:'',back:'',frontImg:'',backImg:'',draft:true};if(!state.decks.length)return toast('Primero creá un mazo');modal(`<div class="modal-title"><h2>${fresh?'Nueva tarjeta':'Editar tarjeta'}</h2><button class="x ghost" id="close-card">×</button></div><div class="form-grid"><label class="field">Mazo<select id="card-deck">${deckOptions(c.deckId)}</select></label><div></div>${faceEditor('front','Anverso','Pregunta o concepto',c.front,c.frontImg)}${faceEditor('back','Reverso','Respuesta o explicación',c.back,c.backImg)}</div><div class="modal-actions"><button class="add" id="save-card">Guardar tarjeta</button></div>`);let imgs={front:c.frontImg,back:c.backImg};function persist(){Object.assign(c,{deckId:$('#card-deck').value,front:$('#front').value.trim(),back:$('#back').value.trim(),frontImg:imgs.front,backImg:imgs.back});c.draft=!complete(c);if(fresh&&!state.cards.some(x=>x.id===c.id))state.cards.push(c);return save()}function close(){persist();closeModal();render()}function setImg(side,data){imgs[side]=data;let preview=$('#'+side+'-preview');preview.src=data;preview.classList.toggle('hidden',!data);$('[data-remove-img="'+side+'"]').classList.toggle('hidden',!data);persist()}function useImage(side,file){if(!file||!file.type?.startsWith('image/'))return false;let r=new FileReader;r.onload=()=>setImg(side,r.result);r.readAsDataURL(file);return true}function pasteImage(side,event){let items=event.clipboardData?.items||[];for(let item of items){if(item.type?.startsWith('image/')){event.preventDefault();useImage(side,item.getAsFile());toast('Imagen pegada');return true}}return false}function pasteText(text,event){if(pasteImage(text.id,event))return;let value=event.clipboardData?.getData('text/plain');if(value===undefined||value===null)return;event.preventDefault();text.setRangeText(value,text.selectionStart,text.selectionEnd,'end');persist()}['front','back'].forEach(s=>{let text=$('#'+s);text.oninput=persist;text.onpaste=e=>pasteText(text,e);$('[data-pick="'+s+'"]').onclick=()=>$('#'+s+'-file').click();$('#'+s+'-file').onchange=e=>{useImage(s,e.target.files[0]);e.target.value=''};$('[data-remove-img="'+s+'"]').onclick=()=>{setImg(s,'');toast('Imagen quitada')};$('[data-paste="'+s+'"]').onclick=async()=>{try{if(!navigator.clipboard?.read)throw Error();let items=await navigator.clipboard.read();for(let item of items){let type=item.types.find(t=>t.startsWith('image/'));if(type){useImage(s,await item.getType(type));toast('Imagen pegada');return}}toast('No hay una imagen en el portapapeles')}catch{text.focus();toast('Ahora pegá con Ctrl+V dentro de este campo')}};$('#card-deck').onchange=persist});$('#close-card').onclick=close;$('#save-card').onclick=close}
function renderReview(){hierarchy();let el=$('#review-content'),cards=reviewCards(),dir=state.reviewDirection||'front',subjects=state.subjects.filter(s=>subjectFolders(s.id).flatMap(f=>folderDecks(f.id).map(d=>d.id)).some(id=>(state.studySelection||[]).includes(id))).map(s=>s.name);$('#review-decks').innerHTML=`<div class="review-tools"><button class="deck ${dir==='front'?'active':''}" data-direction="front">Anverso → reverso</button><button class="deck ${dir==='back'?'active':''}" data-direction="back">Reverso → anverso</button><button class="ghost" id="choose-study">Elegir qué repasar</button><button class="ghost randomize" id="reshuffle">↻ Randomizar</button><span class="study-summary">${subjects.length?esc(subjects.join(' · ')): 'Sin selección'}</span></div>`;$('#review-decks').querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{state.reviewDirection=b.dataset.direction;state.current=null;save();renderReview()});$('#choose-study').onclick=studyModal;$('#reshuffle').onclick=reshuffle;$('#study-deck').textContent=dir==='front'?'Anverso → reverso':'Reverso → anverso';$('#study-count').textContent=cards.length+' tarjetas';if(!cards.length){el.innerHTML='<div class="empty"><div><h2>Elegí al menos una materia o mazo</h2><button class="add" id="choose-study-empty">Elegir qué repasar</button></div></div>';$('#choose-study-empty').onclick=studyModal;return}if(!state.current||!cards.some(c=>c.id===state.current.id)){nextCard();return}let c=state.current,question=dir==='front'?'front':'back',answer=dir==='front'?'back':'front',img=answer==='front'?c.frontImg:c.backImg,ref=state.flipped?`<div class="question-reference"><b>Consigna</b>${renderRich(c[question])}</div>`:'';let shown=state.flipped?answer:question;el.innerHTML=`<article class="study-card ${img?'has-img':''} ${state.flipped?'has-reference':''}"><div class="label">${state.flipped?'Respuesta':'Pregunta'}</div><button class="ghost review-edit" data-edit-review title="Editar tarjeta">✎ Editar</button>${cardFace(c[shown],state.flipped?img:(question==='front'?c.frontImg:c.backImg),ref)}</article>${state.flipped?`<div class="grades"><button class="grade-error" data-grade="error">Error<br><small>pronto</small></button><button class="grade-mid" data-grade="mid">Incompleto<br><small>más tarde</small></button><button class="grade-good" data-grade="good">Correcto<br><small>mucho más tarde</small></button></div>`:`<button class="flip" id="flip">Ver respuesta</button>`}`;el.querySelector('.study-card').onclick=flip;el.querySelector('[data-edit-review]').onclick=e=>{e.stopPropagation();cardModal(c)};if(!state.flipped)$('#flip').onclick=flip;else el.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade));requestAnimationFrame(fitReviewCard)}
